name: Mise à jour mensuelle

on:
  schedule:
    - cron: "0 6 1 * *"   # le 1er de chaque mois à 06:00 UTC (09:00 à Madagascar)
  workflow_dispatch:       # lancement manuel depuis l'onglet Actions
  push:                    # à chaque modification du code poussée sur main
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "requirements.txt"
      - ".github/workflows/mise-a-jour-mensuelle.yml"

permissions:
  contents: write          # pour commiter les graphiques mis à jour

concurrency:
  group: mise-a-jour
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      # Les grilles WorldPop (environ 940 Mo), le PDF du recensement et la liste des établissements
      # de santé sont des versions publiées qui ne changent pas : on les garde d'un mois à l'autre.
      - name: Restaurer les fichiers volumineux déjà téléchargés
        uses: actions/cache@v6
        with:
          path: |
            data/brut/worldpop
            data/brut/worldpop_100m
            data/brut/instat_rgph3
            data/brut/sante_etablissements
          key: donnees-fixes-worldpop-r2025a-rgph3-sante2019

      - name: Exécuter le pipeline
        run: python src/pipeline.py

      - name: Conserver les données et le rapport
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: donnees-${{ github.run_id }}
          path: |
            data/
            sorties/
            !data/brut/worldpop/
            !data/brut/worldpop_100m/
            !data/brut/instat_rgph3/
          retention-days: 90
          if-no-files-found: ignore

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Construire l'application web
        working-directory: web
        run: |
          npm ci
          npm run build

      # Site publié : l'application React à la racine, la page HTML d'origine sous /classique/
      - name: Assembler le site
        run: |
          mkdir -p site/classique
          cp -r web/dist/. site/
          cp sorties/tableau_de_bord/index.html site/classique/index.html
          cp docs/apercu.png site/apercu.png   # image des aperçus de liens (og:image)

      - name: Préparer le site pour GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Commiter les graphiques s'ils ont changé
        run: |
          git add sorties/*.png
          if git diff --cached --quiet; then
            echo "Aucun changement dans les graphiques."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mise à jour des graphiques ($(date -u +%Y-%m-%d))"
          # Un autre commit a pu arriver sur main pendant l'exécution : on se place après lui
          git pull --rebase
          git push

  publication:
    needs: pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write         # publier sur GitHub Pages
      id-token: write      # prouver l'origine du déploiement
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Publier le tableau de bord
        id: deploiement
        uses: actions/deploy-pages@v5
